{% extends "base.html" %}
{% block title %}Delete Writing Exercise{% endblock %}
{% block content %}
<div class="card">
  <h2>Are you sure you want to delete this Writing Exercise?</h2>
  <p><strong>{{ exercise.title }}</strong> ({{ exercise.get_exercise_type_display }})</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'writing_exercise_list' %}" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
