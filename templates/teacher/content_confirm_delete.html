{% extends "base.html" %}
{% block title %}Delete Content{% endblock %}
{% block content %}
<div class="card">
  <h2>Are you sure you want to delete this content?</h2>
  <p><strong>{{ content.get_content_type_display }}</strong> - {{ content.content|truncatechars:50 }}</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'content_list' lesson.id %}" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
