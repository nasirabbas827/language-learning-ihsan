{% extends "base.html" %}
{% block title %}Delete Live Session{% endblock %}
{% block content %}
<div class="card">
  <h2>Are you sure you want to delete this session?</h2>
  <p><strong>{{ session.title }}</strong> ({{ session.start_time|date:"Y-m-d H:i" }})</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'live_session_list' %}" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
