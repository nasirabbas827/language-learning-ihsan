{% extends "base.html" %}
{% block title %}Delete Quiz{% endblock %}
{% block content %}
<div class="card">
  <h2>Are you sure you want to delete this quiz?</h2>
  <p><strong>{{ quiz.question }}</strong></p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'quiz_list' %}" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
