{% extends "base.html" %}
{% block title %}Delete Lesson{% endblock %}
{% block content %}
<div class="card">
    <h2>Delete Lesson</h2>
    <p>Are you sure you want to delete <strong>{{ lesson.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'lesson_list' %}" class="btn">Cancel</a>
    </form>
</div>
{% endblock %}
