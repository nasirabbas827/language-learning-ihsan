{% extends "base.html" %}
{% block title %}Quiz - {{ lesson.title }}{% endblock %}
{% block content %}
<div class="card">
    <h2>Quiz for {{ lesson.title }}</h2>
    <form method="post">
        {% csrf_token %}
        {% for quiz in quizzes %}
            <div style="margin-bottom:20px;">
                <p><strong>{{ forloop.counter }}. {{ quiz.question }}</strong></p>
                <label><input type="radio" name="q{{ quiz.id }}" value="option1"> {{ quiz.option1 }}</label><br>
                <label><input type="radio" name="q{{ quiz.id }}" value="option2"> {{ quiz.option2 }}</label><br>
                <label><input type="radio" name="q{{ quiz.id }}" value="option3"> {{ quiz.option3 }}</label><br>
                <label><input type="radio" name="q{{ quiz.id }}" value="option4"> {{ quiz.option4 }}</label><br>
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Submit Quiz</button>
    </form>
</div>
{% endblock %}
